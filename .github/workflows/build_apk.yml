name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Proper Android Structure and Build
      run: |
        # Create standard Android project layout if missing
        mkdir -p app/src/main/java/com/hanuman/matka
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/mipmap-hdpi

        # Create a basic MainActivity if none exists
        if [ ! -f "app/src/main/java/com/hanuman/matka/MainActivity.java" ]; then
            cat << 'EOF' > app/src/main/java/com/hanuman/matka/MainActivity.java
            package com.hanuman.matka;
            import android.app.Activity;
            import android.os.Bundle;
            public class MainActivity extends Activity {
                @Override
                protected void onCreate(Bundle savedInstanceState) {
                    super.onCreate(savedInstanceState);
                }
            }
            EOF
        fi

        # Create AndroidManifest.xml
        if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            cat << 'EOF' > app/src/main/AndroidManifest.xml
            <manifest xmlns:android="http://schemas.android.com/apk/res/android"
                package="com.hanuman.matka">
                <application
                    android:allowBackup="true"
                    android:label="Hanuman Matka">
                    <activity android:name=".MainActivity"
                        android:exported="true">
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.LAUNCHER" />
                        </intent-filter>
                    </activity>
                </application>
            </manifest>
            EOF
        fi

        # Create settings.gradle and root build.gradle
        echo "include ':app'" > settings.gradle
        
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # Create app/build.gradle
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            compileSdk 34
            defaultConfig {
                applicationId "com.hanuman.matka"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

        gradle wrapper --gradle-version 8.1.1 --distribution-type bin
        ./gradlew clean assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
