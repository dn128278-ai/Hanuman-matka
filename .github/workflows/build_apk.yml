name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Proper Android Structure and Build
      run: |
        mkdir -p app/src/main/java/com/hanuman/matka
        mkdir -p app/src/main/res/values

        echo "package com.hanuman.matka;" > app/src/main/java/com/hanuman/matka/MainActivity.java
        echo "import android.app.Activity;" >> app/src/main/java/com/hanuman/matka/MainActivity.java
        echo "import android.os.Bundle;" >> app/src/main/java/com/hanuman/matka/MainActivity.java
        echo "public class MainActivity extends Activity {" >> app/src/main/java/com/hanuman/matka/MainActivity.java
        echo "    @Override protected void onCreate(Bundle b) { super.onCreate(b); }" >> app/src/main/java/com/hanuman/matka/MainActivity.java
        echo "}" >> app/src/main/java/com/hanuman/matka/MainActivity.java

        echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.hanuman.matka">' > app/src/main/AndroidManifest.xml
        echo '    <application android:label="Hanuman Matka">' >> app/src/main/AndroidManifest.xml
        echo '        <activity android:name=".MainActivity" android:exported="true">' >> app/src/main/AndroidManifest.xml
        echo '            <intent-filter>' >> app/src/main/AndroidManifest.xml
        echo '                <action android:name="android.intent.action.MAIN" />' >> app/src/main/AndroidManifest.xml
        echo '                <category android:name="android.intent.category.LAUNCHER" />' >> app/src/main/AndroidManifest.xml
        echo '            </intent-filter>' >> app/src/main/AndroidManifest.xml
        echo '        </activity>' >> app/src/main/AndroidManifest.xml
        echo '    </application>' >> app/src/main/AndroidManifest.xml
        echo '</manifest>' >> app/src/main/AndroidManifest.xml

        echo "include ':app'" > settings.gradle

        echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.0' } }" > build.gradle
        echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle

        echo "apply plugin: 'com.android.application'" > app/build.gradle
        echo "android { compileSdk 34; defaultConfig { applicationId 'com.hanuman.matka'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0'; } }" >> app/build.gradle

        gradle wrapper --gradle-version 8.1.1 --distribution-type bin
        ./gradlew clean assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
