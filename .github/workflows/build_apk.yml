name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK Direct
      run: |
        # Install Android Build Tools via SDK Manager if needed or use simple debug compilation
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME
        
        # Create minimal valid gradle files that don't trigger dependency handler errors
        echo "include ':app'" > settings.gradle
        
        cat << 'EOF' > build.gradle
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        mkdir -p app
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            compileSdk 34
            defaultConfig {
                applicationId "com.hanuman.matka"
                minSdk 24
                targetSdk 34
            }
        }
        EOF

        # Use gradle wrapper initialization
        npx --yes bower || true
        ./gradlew --version || gradle wrapper --gradle-version 8.4
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
